<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>techresidencial — Automação e Inovação Residencial</title>
    <style>
        :root {
            --bg-dark: #0b0712;
            --purple-dark: #1b102b;
            --purple-card: #27163e;
            --purple-primary: #8a2be2;
            --purple-light: #9d4edd;
            --text-light: #ffffff;
            --text-gray: #d1c4e9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        /* Cabecalho */
        header {
            background: rgba(11, 7, 18, 0.95);
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            padding: 12px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid var(--purple-primary);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            height: 40px;
            width: auto;
            object-fit: contain;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: -0.5px;
        }

        .logo-text .tech {
            color: #ffffff;
        }

        .logo-text .residencial {
            color: var(--purple-light);
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
            transition: 0.3s;
        }

        nav a:hover {
            color: var(--purple-light);
        }

        /* Hero / Apresentacao Principal */
        .hero {
            padding: 160px 5% 80px;
            text-align: center;
            background: radial-gradient(circle at top, rgba(138, 43, 226, 0.25) 0%, rgba(11, 7, 18, 1) 70%);
        }

        .hero-logo {
            max-width: 260px;
            height: auto;
            margin-bottom: 25px;
        }

        .hero h1 {
            font-size: 2.6rem;
            margin-bottom: 20px;
            color: var(--text-light);
        }

        .hero h1 span {
            color: var(--purple-light);
        }

        .hero p {
            font-size: 1.15rem;
            color: var(--text-gray);
            max-width: 780px;
            margin: 0 auto 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: linear-gradient(135deg, var(--purple-primary), var(--purple-light));
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(157, 78, 221, 0.6);
        }

        /* Secoes Gerais */
        .section {
            padding: 70px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 20px;
            color: var(--purple-light);
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-gray);
            max-width: 700px;
            margin: -10px auto 40px;
        }

        /* Sobre a Empresa */
        .about-box {
            background-color: var(--purple-card);
            padding: 35px;
            border-radius: 16px;
            border: 1px solid rgba(157, 78, 221, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
